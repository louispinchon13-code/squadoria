<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Squadoria - Trouve ta squad</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
*{box-sizing:border-box} body{margin:0;font-family:Arial;background:#FDF8EE;color:#1A3C34}
header{background:#FDF8EE;padding:16px 20px;display:flex;justify-content:space-between;border-bottom:1px solid #E8DDC5;position:sticky;top:0}
.wrap{max-width:900px;margin:auto;padding:20px}
.hero{background:#1A3C34;color:#fff;border-radius:24px;padding:26px}
.btn{background:#1A3C34;color:#fff;border:0;padding:11px 16px;border-radius:999px;font-weight:bold;cursor:pointer}
.btn-gold{background:#C9A86A;color:#1A3C34}
.tab{padding:10px 16px;border-radius:999px;background:#fff;border:1px solid #E8DDC5;cursor:pointer;font-weight:bold}
.tab.active{background:#1A3C34;color:#fff}
.card{background:#fff;border:1px solid #ECE3CD;border-radius:18px;padding:16px;margin-bottom:12px}
input,select{width:100%;padding:12px;border-radius:12px;border:1px solid #E8DDC5;margin:6px 0}
.hidden{display:none}.msg{background:#F3EEDF;padding:10px 12px;border-radius:12px;margin:6px 0}
</style>
</head>
<body>
<header><div><b style="font-size:24px">Squadoria</b><div style="font-size:12px;color:#7a8a84">Trouve ta squad - VRAIE APP</div></div><div>100% gratuit • Zéro pub</div></header>
<div class="wrap">
<div class="hero"><h1>Trouve ta squad.<br>Joue ensemble, sur console.</h1><p>Crée ton vrai profil, il apparaît pour tout le monde.</p></div>
<div style="display:flex;gap:8px;margin:18px 0">
<button class="tab active" onclick="showTab('accueil',this)">Joueurs réels</button>
<button class="tab" onclick="showTab('messages',this)">Messages réels</button>
</div>
<div id="accueil">
<div class="card"><b>Créer mon vrai profil</b>
<input id="pseudo" placeholder="Ton pseudo ex: Louis">
<select id="jeu"><option>FC 26</option><option>Fortnite</option><option>Valorant</option><option>GTA V</option><option>Call of Duty</option><option>Rocket League</option><option>Minecraft</option><option>Apex Legends</option><option>eFootball</option></select>
<select id="console"><option>PS5</option><option>Xbox</option><option>PC</option><option>Mobile</option></select>
<button class="btn btn-gold" onclick="createProfile()">+ Publier mon profil</button><div id="profilOk"></div></div>
<input id="search" placeholder="Rechercher un vrai joueur..." oninput="renderProfiles()">
<div id="players"><p>Chargement des vrais joueurs...</p></div>
</div>
<div id="messages" class="hidden">
<div class="card"><b>Messages réels</b><div id="chat"></div><input id="msgPseudo" placeholder="Ton pseudo"><input id="msgInput" placeholder="Ton message..."><button class="btn" onclick="sendMsg()">Envoyer</button></div>
</div>
</div>
<script>
const SUPABASE_URL = "https://ubfsdmbwyvzzenitpszd.supabase.co";
const SUPABASE_KEY = "sb_publishable_-1pvG0SQOsZzDJTPok_I1g_WVcw4TTq";
const sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let allProfiles = [];
async function loadProfiles(){
let {data} = await sb.from("profiles").select("*").order("created_at",{ascending:false});
allProfiles = data || [];
renderProfiles();
}
function renderProfiles(){
let q = document.getElementById("search").value.toLowerCase();
let list = allProfiles.filter(p=>(p.pseudo||"").toLowerCase().includes(q)||(p.jeu||"").toLowerCase().includes(q));
document.getElementById("players").innerHTML = list.length ? list.map(p=>`<div class="card"><b>${p.pseudo} - ${p.jeu}</b><div>${p.console} • Vrai joueur</div></div>`).join("") : "<p>Aucun vrai profil pour l'instant. Sois le premier.</p>";
}
async function createProfile(){
let pseudo=document.getElementById("pseudo").value;
let jeu=document.getElementById("jeu").value;
let consoleV=document.getElementById("console").value;
if(!pseudo) {document.getElementById("profilOk").innerHTML="Mets ton pseudo."; return;}
let {error} = await sb.from("profiles").insert([{pseudo:pseudo, jeu:jeu, console:consoleV}]);
if(error){document.getElementById("profilOk").innerHTML="Erreur : "+error.message; return;}
document.getElementById("profilOk").innerHTML="✅ Profil publié, tout le monde peut te voir.";
document.getElementById("pseudo").value="";
loadProfiles();
}
async function loadMessages(){
let {data} = await sb.from("messages").select("*").order("created_at",{ascending:true}).limit(50);
document.getElementById("chat").innerHTML = (data||[]).map(m=>`<div class="msg"><b>${m.pseudo} :</b> ${m.texte}</div>`).join("") || "<p>Aucun message.</p>";
}
async function sendMsg(){
let pseudo=document.getElementById("msgPseudo").value;
let texte=document.getElementById("msgInput").value;
if(!pseudo||!texte) return;
await sb.from("messages").insert([{pseudo:pseudo, texte:texte}]);
document.getElementById("msgInput").value="";
loadMessages();
}
function showTab(id,btn){
["accueil","messages"].forEach(x=>document.getElementById(x).classList.toggle("hidden",x!==id));
document.querySelectorAll(".tab").forEach(b=>b.classList.remove("active")); btn.classList.add("active");
if(id==="messages") loadMessages();
}
loadProfiles(); loadMessages();
setInterval(()=>{loadProfiles(); loadMessages();}, 5000);
</script>
</body>
</html>
